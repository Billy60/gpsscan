<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GPS Scan → Maps</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0e1a;
      color: #e0eeff;
      font-family: 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0f1628;
      padding: 10px 16px;
      border-bottom: 1px solid #1e2d4a;
      text-align: center;
    }
    header h1 { font-size: 1.1rem; color: #00d4ff; letter-spacing: 2px; }
    header p  { font-size: 0.75rem; color: #4a6080; margin-top: 2px; }

    #panel {
      background: #0f1628;
      padding: 12px 16px;
      border-top: 1px solid #1e2d4a;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    #result-box {
      background: #0a0e1a;
      border: 1px solid #1e2d4a;
      border-radius: 6px;
      padding: 12px;
      min-height: 70px;
    }
    .coord-line {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: #00ff9d;
      letter-spacing: 1px;
    }
    .coord-line.empty { color: #4a6080; font-size: 0.85rem; }
    .status-line { font-size: 0.7rem; color: #4a6080; margin-top: 6px; font-style: italic; }

    #progress { height: 3px; background: #1e2d4a; border-radius: 2px; overflow: hidden; }
    #progress-bar { height: 100%; background: #00d4ff; width: 0%; transition: width 0.3s; }

    .btn-row { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 14px; border: none; border-radius: 6px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    button:active { opacity: 0.7; }
    #btn-photo { background: #6644aa; color: #fff; }
    #btn-maps  { background: #00ff9d; color: #0a0e1a; }
    #btn-maps:disabled { background: #1e2d4a; color: #4a6080; }

    canvas { display: none; }
    #preview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      display: none;
      margin: 0 auto;
      object-fit: contain;
    }
  </style>
</head>
<body>

<header>
  <h1>📡 GPS SCAN → MAPS</h1>
  <p>Choisir une photo de l'écran radio</p>
</header>

<div id="panel">
  <img id="preview" alt="aperçu" />

  <div id="progress"><div id="progress-bar"></div></div>

  <div id="result-box">
    <div class="coord-line empty" id="coord-display">Choisir une photo pour commencer</div>
    <div class="status-line" id="status-line">En attente</div>
  </div>

  <div class="btn-row">
    <button id="btn-photo" onclick="document.getElementById('file-input').click()">🖼 CHOISIR PHOTO</button>
    <button id="btn-maps" onclick="openMaps()" disabled>🗺 GOOGLE MAPS</button>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="scanFile(this)">
</div>

<canvas id="canvas"></canvas>

<script>
  let latFound = null, lonFound = null;
  let worker = null;

  async function initOCR() {
    if (worker) return;
    setStatus('Initialisation OCR...');
    worker = await Tesseract.createWorker('eng', 1, {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js',
      langPath: 'https://tessdata.projectnaptha.com/4.0.0',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4/tesseract-core.wasm.js',
    });
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789.-',
    });
    setStatus('Prêt');
  }

  function parseCoords(text) {
    console.log('OCR texte:', text);

    // Extraire tous les nombres décimaux
    const nums = [];
    const re = /\d{1,3}[.,]\d{4,7}/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      nums.push(parseFloat(m[0].replace(',', '.')));
    }
    console.log('Nombres:', nums);

    // Chercher LAT (40-60) et LON (-5 à 10) pour la France
    let lat = null, lon = null;
    for (let i = 0; i < nums.length; i++) {
      if (nums[i] >= 40 && nums[i] <= 60) {
        for (let j = 0; j < nums.length; j++) {
          if (i !== j && nums[j] >= 0 && nums[j] <= 10) {
            lat = nums[i];
            lon = nums[j];
            break;
          }
        }
        if (lat !== null) break;
      }
    }

    if (lat !== null && lon !== null) {
      latFound = lat;
      lonFound = lon;
      document.getElementById('coord-display').textContent =
        lat.toFixed(6) + ',  ' + lon.toFixed(6);
      document.getElementById('coord-display').className = 'coord-line';
      document.getElementById('btn-maps').disabled = false;
      setStatus('✔ Coordonnées trouvées !');
    } else {
      document.getElementById('coord-display').textContent = 'Non trouvé — réessayer';
      document.getElementById('coord-display').className = 'coord-line empty';
      document.getElementById('btn-maps').disabled = true;
      setStatus('Nombres détectés: ' + nums.join(', '));
    }
  }

  async function scanFile(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];

    setStatus('Chargement...');
    setProgress(10);

    const img = new Image();
    img.onload = async function() {
      // Aperçu
      const preview = document.getElementById('preview');
      preview.src = img.src;
      preview.style.display = 'block';

      // Dessiner sur canvas avec contraste
      const canvas = document.getElementById('canvas');
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.filter = 'grayscale(1) contrast(2.5) brightness(1.2)';
      ctx.drawImage(img, 0, 0);

      setProgress(40);
      setStatus('OCR en cours...');

      try {
        await initOCR();
        setProgress(60);
        const result = await worker.recognize(canvas);
        setProgress(90);
        parseCoords(result.data.text);
      } catch(e) {
        setStatus('Erreur: ' + e.message);
        console.error(e);
      }

      setProgress(100);
      setTimeout(() => setProgress(0), 1000);
    };
    img.onerror = () => setStatus('Erreur chargement image');
    img.src = URL.createObjectURL(file);
  }

  function openMaps() {
    if (latFound === null) return;
    window.open('https://maps.google.com/?q=' + latFound + ',' + lonFound, '_blank');
  }

  function setStatus(msg) { document.getElementById('status-line').textContent = msg; }
  function setProgress(v) { document.getElementById('progress-bar').style.width = v + '%'; }

  // Init OCR au chargement
  initOCR();
</script>
</body>
</html>
