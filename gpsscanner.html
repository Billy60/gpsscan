<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>GPS Scan → Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0e1a; color: #e0eeff; font-family: sans-serif;
           min-height: 100dvh; display: flex; flex-direction: column; }
    header { background: #0f1628; padding: 10px; text-align: center; border-bottom: 1px solid #1e2d4a; }
    header h1 { font-size: 1.1rem; color: #00d4ff; }
    header p  { font-size: 0.75rem; color: #4a6080; }
    #panel { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    #preview { max-width: 100%; max-height: 180px; border-radius: 6px; display: none; margin: 0 auto; }
    #progress { height: 3px; background: #1e2d4a; border-radius: 2px; overflow: hidden; }
    #progress-bar { height: 100%; background: #00d4ff; width: 0%; transition: width 0.3s; }
    #result-box { background: #0a0e1a; border: 1px solid #1e2d4a; border-radius: 6px; padding: 12px; min-height: 70px; }
    #coord-display { font-family: monospace; font-size: 1.1rem; color: #00ff9d; }
    #coord-display.empty { color: #4a6080; font-size: 0.85rem; }
    #status-line { font-size: 0.7rem; color: #4a6080; margin-top: 6px; word-break: break-all; }
    .btn-row { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    #btn-photo { background: #6644aa; color: #fff; }
    #btn-maps  { background: #00ff9d; color: #0a0e1a; }
    #btn-maps:disabled { background: #1e2d4a; color: #4a6080; }
  </style>
</head>
<body>
<header>
  <h1>📡 GPS SCAN → MAPS</h1>
  <p>Choisir une photo de l'écran radio</p>
</header>
<div id="panel">
  <img id="preview" alt="aperçu" />
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="result-box">
    <div class="empty" id="coord-display">Choisir une photo pour commencer</div>
    <div id="status-line">En attente</div>
  </div>
  <div class="btn-row">
    <button id="btn-photo" onclick="document.getElementById('file-input').click()">🖼 CHOISIR PHOTO</button>
    <button id="btn-maps" onclick="openMaps()" disabled>🗺 GOOGLE MAPS</button>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="scanFile(this)">
</div>

<script>
let latFound = null, lonFound = null;

function setStatus(msg) { document.getElementById('status-line').textContent = msg; }
function setProgress(v) { document.getElementById('progress-bar').style.width = v + '%'; }

function parseCoords(text) {
  console.log('OCR texte:', text);
  const nums = [];
  const re = /\d{1,3}[.,]\d{4,7}/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    nums.push(parseFloat(m[0].replace(',','.')));
  }
  console.log('Nombres:', nums);

  let lat = null, lon = null;
  for (let i = 0; i < nums.length; i++) {
    if (nums[i] >= 40 && nums[i] <= 60) {
      for (let j = 0; j < nums.length; j++) {
        if (i !== j && nums[j] >= 0 && nums[j] <= 15) {
          lat = nums[i]; lon = nums[j]; break;
        }
      }
      if (lat !== null) break;
    }
  }

  if (lat !== null) {
    latFound = lat; lonFound = lon;
    document.getElementById('coord-display').textContent = lat.toFixed(6) + ',  ' + lon.toFixed(6);
    document.getElementById('coord-display').className = '';
    document.getElementById('btn-maps').disabled = false;
    setStatus('✔ Coordonnées trouvées !');
  } else {
    document.getElementById('coord-display').textContent = 'Non trouvé';
    document.getElementById('coord-display').className = 'empty';
    document.getElementById('btn-maps').disabled = true;
    setStatus('Nombres: ' + (nums.length ? nums.join(', ') : 'aucun'));
  }
}

async function scanFile(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  
  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('preview').style.display = 'block';
  
  setStatus('Envoi vers OCR.space...');
  setProgress(20);

  const formData = new FormData();
  formData.append('file', file);
  formData.append('apikey', 'helloworld');  // clé gratuite OCR.space
  formData.append('language', 'eng');
  formData.append('isOverlayRequired', 'false');
  formData.append('detectOrientation', 'true');
  formData.append('scale', 'true');
  formData.append('OCREngine', '2');  // Engine 2 = meilleur pour les chiffres

  try {
    setProgress(40);
    const response = await fetch('https://api.ocr.space/parse/image', {
      method: 'POST',
      body: formData
    });
    setProgress(80);
    const data = await response.json();
    console.log('OCR.space réponse:', data);
    
    if (data.ParsedResults && data.ParsedResults.length > 0) {
      const text = data.ParsedResults[0].ParsedText;
      setStatus('OCR OK — analyse...');
      console.log('Texte brut:', JSON.stringify(text));
      // Afficher le texte brut pour debug
      document.getElementById('status-line').textContent = 'OCR: ' + text.substring(0, 100);
      parseCoords(text);
    } else {
      setStatus('OCR.space: ' + (data.ErrorMessage || 'pas de résultat'));
    }
  } catch(e) {
    setStatus('Erreur réseau: ' + e.message);
    console.error(e);
  }
  setProgress(100);
  setTimeout(() => setProgress(0), 1000);
}

function openMaps() {
  if (latFound === null) return;
  window.open('https://maps.google.com/?q=' + latFound + ',' + lonFound, '_blank');
}
</script>
</body>
</html>
